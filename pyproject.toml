[project]
name = "sf-quant"
version = "0.3.0"
description = "Python package for Silver Fund quant team research and trading tools."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Andrew Hall", email = "andrewmartinhall2@gmail.com" }]
dependencies = [
    "click>=8.1",
    "cvxpy>=1.7.2",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "polars>=1.32.3",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
]

[project.scripts]
sf_backtest = "sf_quant.backtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "pydata-sphinx-theme>=0.16.1",
    "ruff>=0.15.0",
    "ipykernel>=7.1.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]  # tests import the synthetic market from tests/synthetic.py
