# sf-backtester config. Long-only, full investment, and zero active beta are
# always enforced; under profile: mandate the TE target is locked to 5%.

name: momentum
start: 2010-01-01
end: 2024-12-31
rebalance: monthly            # monthly | weekly | daily
execution_lag_days: 1         # alpha formed at close t, traded at close t+1

profile: mandate              # mandate | experimental
active_risk_target: 0.05      # annualized; locked under profile: mandate
factor_bounds: {}             # optional caps on |active exposure|, e.g. {USSLOWL_SIZE: 0.10}
on_failure: hold_previous     # hold_previous | raise

bps_grid: [0, 5, 10, 20]      # costs charged on realized turnover
pass_ir: 0.0                  # breakeven cost is where net IR falls to this
holdout_start: 2025-01-01     # runs stop here unless unlock_holdout: true
unlock_holdout: false
min_alpha_coverage: 0.5

aum: 1000000
min_position_dollars: 100     # smaller positions are flagged in diagnostics

n_workers: 8
slurm:
  n_cpus: 8
  mem: 32G
  time: "06:00:00"
  email: your.email@byu.edu
